services:
  web:
    build: .
    ports:
      - "8082:8082"
    environment:
      - DRIVE_BUCKET=${DRIVE_BUCKET:-tokendrive-files-local}
      - DRIVE_TABLE=tokendrive-index
      - API_KEYS_TABLE=tokenburner-api-keys
      - AWS_PROFILE=tokenburner
      - AWS_REGION_NAME=us-west-2
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ~/.aws:/root/.aws:ro
